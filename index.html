
<!DOCTYPE html>
<html lang="my">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>
    <meta
    name="apple-mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
>

<meta
    name="apple-mobile-web-app-title"
    content="My File Manager"
>

<meta
    name="theme-color"
    content="#007aff"
>
<link rel="stylesheet" href="./css/style.css">
<title>My File Manager — Mobile V4</title>



</head>


<body>

<div class="app">


<header class="header">

    <div class="brand">

        <div class="app-logo" aria-label="File Manager">
            <svg viewBox="0 0 128 128" width="52" height="52" role="img" aria-hidden="true">
                <defs>
                    <linearGradient id="iosFolderBlue" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#64D2FF"/>
                        <stop offset=".48" stop-color="#0A84FF"/>
                        <stop offset="1" stop-color="#0066CC"/>
                    </linearGradient>
                    <linearGradient id="iosFolderFront" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#5AC8FA"/>
                        <stop offset="1" stop-color="#0A84FF"/>
                    </linearGradient>
                    <filter id="folderShadow" x="-30%" y="-30%" width="160%" height="180%">
                        <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".22"/>
                    </filter>
                </defs>
                <g filter="url(#folderShadow)">
                    <path d="M14 39c0-7.7 6.3-14 14-14h27l9 10h31c7.7 0 14 6.3 14 14v38c0 7.7-6.3 14-14 14H28c-7.7 0-14-6.3-14-14V39z" fill="url(#iosFolderBlue)"/>
                    <path d="M14 48c0-5 4-9 9-9h82c2.2 0 4.3.8 5.9 2.2L119 48v39c0 7.7-6.3 14-14 14H28c-7.7 0-14-6.3-14-14V48z" fill="url(#iosFolderFront)"/>
                    <path d="M20 51c0-3.3 2.7-6 6-6h76c4.2 0 8 2.2 10 5.8" fill="none" stroke="rgba(255,255,255,.34)" stroke-width="3" stroke-linecap="round"/>
                    <path d="M39 63h50M39 77h34" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" opacity=".92"/>
                </g>
            </svg>
        </div>
        <div class="brand-text">

            <h1>
                My File Manager
            </h1>

            <p>
                Mobile V4 • Local
            </p>

        </div>

    </div>

    <button class="header-menu" id="headerMenuBtn" type="button" aria-label="Menu" aria-expanded="true" aria-controls="mainToolbar">
        <span class="menu-line"></span><span class="menu-line"></span><span class="menu-line"></span>
    </button>

</header>


<section class="toolbar" id="mainToolbar">

    <button
        id="homeBtn"
        class="toolbar-btn"
        type="button"
    >
        <svg class="ios-menu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.8 12 3l9 7.8v9.2a1 1 0 0 1-1 1h-5.2v-6.3H9.2V21H4a1 1 0 0 1-1-1z"/><path d="M8.5 21v-6.3h7V21"/></svg>
        <span>မူလ</span>
    </button>
<button
    id="favoritesBtn"
    class="toolbar-btn"
    type="button"
>
    <svg class="ios-menu-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 20.5 4.8 13.7C1.6 10.7 3.1 5.5 7.4 4.5c2-.5 3.7.2 4.6 1.7.9-1.5 2.6-2.2 4.6-1.7 4.3 1 5.8 6.2 2.6 9.2z"/>
    </svg>
    <span>အကြိုက်ဆုံး</span>
    </button>
    <button
    id="recentBtn"
    class="toolbar-btn"
    type="button"
>
    <span>🕘</span>
    <span>Recent</span>

</button>

    <button
        id="upBtn"
        class="toolbar-btn"
        type="button"
        disabled
    >
        <svg class="ios-menu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V4"/><path d="m6.5 9.5 5.5-5.5 5.5 5.5"/><path d="M5 20h14"/></svg>
        <span>အပေါ်</span>
    </button>


    <button
        id="newFolderBtn"
        class="toolbar-btn"
        type="button"
    >
        <svg class="ios-menu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H10l2 2h6.5A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"/><path d="M12 10v6M9 13h6"/></svg>
        <span>+ဖိုင်တွဲအသစ်</span>
    </button>


    <button
        id="uploadBtn"
        class="toolbar-btn"
        type="button"
    >
        <svg class="ios-menu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M12 17V11"/><path d="m9.5 13.5 2.5-2.5 2.5 2.5"/></svg>
        <span>ဖိုင်တင်</span>
    </button>


    <!-- NEW -->
    <button
        id="uploadFolderBtn"
        class="toolbar-btn"
        type="button"
    >
        <svg class="ios-menu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H10l2 2h6.5A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"/><path d="M12 16V10"/><path d="m9.5 12.5 2.5-2.5 2.5 2.5"/></svg>
        <span>Folder တင်</span>
    </button>


    <button
        id="reorderBtn"
        class="toolbar-btn"
        type="button"
    >
        <svg class="ios-menu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14"/><path d="m4.5 8.5 3.5-3.5 3.5 3.5"/><path d="M16 19V5"/><path d="m12.5 15.5 3.5 3.5 3.5-3.5"/></svg>
        <span>စီစဉ်</span>
    </button>
<button
        id="refreshBtn"
        class="toolbar-btn"
        type="button"
    >
        <svg class="ios-menu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14-4L4 9"/><path d="M4 5v4h4"/><path d="M4 13a8 8 0 0 0 14 4l2-2"/><path d="M20 19v-4h-4"/></svg>
        <span>ပြန်ဖော်</span>
    </button>

</section>


<section class="search-section">

    <input
        id="searchBox"
        class="search-box"
        type="search"
        placeholder="ဖိုင်နှင့် ဖိုင်တွဲများ ရှာရန်..."
        autocomplete="off"
    >

</section>


<section
    id="breadcrumb"
    class="breadcrumb"
>
</section>


<div
    id="message"
    class="message"
>
    Mobile V4 အသင့်ဖြစ်ပါပြီ။
</div>


<div id="touchActionSheet" class="touch-action-sheet" aria-hidden="true">
  <div class="touch-sheet-backdrop" data-touch-close="1"></div>
  <div class="touch-sheet-card">
    <div class="touch-sheet-title" id="touchMenuTitle">ဖိုင်</div>
    <button id="touchCopyAction" class="touch-sheet-action" type="button">ကူး</button>
    <button id="touchCutAction" class="touch-sheet-action" type="button">ဖြတ်</button>
    <button id="touchPasteAction" class="touch-sheet-action" type="button">ကပ်</button>
    <button id="touchCancelAction" class="touch-sheet-cancel" type="button">မလုပ်တော့</button>
  </div>
</div>
<button id="v4PasteFab" class="v4-paste-fab" type="button">
    <span class="paste-label">ကပ်</span>
</button>

<button
    id="v4PasteCancel"
    class="paste-cancel"
    type="button"
    aria-label="Cancel"
>
    ×
</button>

<div
    id="uploadStatus"
    class="upload-status"
    style="display:none"
>
</div>

<section
    id="reorderBar"
    class="reorder-bar hidden"
>

    <div class="reorder-info">

        <strong>
            ↕️ စီစဉ်နေသည်
        </strong>

        <span>
            အောက်မြှား / အပေါ်မြှားဖြင့်
            အစီအစဉ်ပြောင်းပါ။
        </span>

    </div>


    <div class="reorder-actions">

        <button
            id="saveOrderBtn"
            type="button"
            class="save-btn"
        >
            💾 သိမ်းရန်
        </button>


        <button
            id="cancelOrderBtn"
            type="button"
            class="cancel-btn"
        >
            ✖ ပယ်ဖျက်
        </button>

    </div>

</section>


<main
    id="fileList"
    class="file-list"
>
</main>


<!-- NORMAL FILE UPLOAD -->

<input
    id="fileInput"
    type="file"
    multiple
    hidden
>


<!-- =================================================
     FOLDER UPLOAD

     webkitdirectory:
     Android Chrome supports this well.

     multiple:
     fallback for browsers that do not support
     folder selection.
================================================= -->

<input
    id="folderInput"
    type="file"
    webkitdirectory
    directory
    multiple
    hidden
>


</div>


<script src="./js/app.js"></script>

</body>
</html>
