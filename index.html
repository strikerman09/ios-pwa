<!DOCTYPE html>
<html lang="my">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#007aff"
>

<title>My File Manager — Mobile V4</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background: #f3f4f6;
    color: #111827;

    overscroll-behavior-y: none;
}

button,
input {
    font-family: inherit;
}

button {
    -webkit-appearance: none;
    appearance: none;
}

.app {
    width: 100%;
    min-height: 100vh;

    padding-bottom:
        calc(30px + env(safe-area-inset-bottom));
}


/* =====================================================
   HEADER
===================================================== */

.header {
    background: #1f2937;
    color: white;

    padding:
        calc(14px + env(safe-area-inset-top))
        16px
        14px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 52px;
    height: 52px;

    object-fit: contain;

    border-radius: 10px;

    background: white;

    flex-shrink: 0;
}

.app-logo {
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border-radius: 14px;
    background: rgba(255,255,255,.96);
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
}

.app-logo svg {
    display: block;
}

.brand-text {
    min-width: 0;
}

.brand-text h1 {
    margin: 0;

    font-size: 18px;
    line-height: 1.5;

    font-weight: 700;
}

.brand-text p {
    margin: 3px 0 0;

    font-size: 13px;

    opacity: 0.8;
}


/* =====================================================
   TOOLBAR
===================================================== */

.toolbar {
    display: grid;

    grid-template-columns:
        repeat(7, 1fr);

    gap: 6px;

    padding: 10px;

    background: white;

    border-bottom:
        1px solid #e5e7eb;

    position: sticky;

    top: 0;

    z-index: 50;
}

.toolbar-btn {
    min-width: 0;

    min-height: 58px;

    border:
        1px solid #d1d5db;

    border-radius: 10px;

    background: white;

    color: #111827;

    font-size: 18px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 2px;

    cursor: pointer;

    touch-action: manipulation;
}

.ios-menu-icon {
    width: 23px;
    height: 23px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
    transition: transform .18s ease, opacity .18s ease;
}

.toolbar-btn:active .ios-menu-icon {
    transform: scale(.88);
    opacity: .72;
}

.toolbar-btn:disabled .ios-menu-icon {
    opacity: .38;
}

.toolbar-btn span {
    font-size: 9px;

    white-space: nowrap;
}

.toolbar-btn:active {
    transform: scale(.96);

    background: #f3f4f6;
}

.toolbar-btn:disabled {
    opacity: .35;

    cursor: default;

    transform: none;
}


/* =====================================================
   SEARCH
===================================================== */

.search-section {
    padding: 10px;

    background: #f3f4f6;
}

.search-box {
    width: 100%;

    height: 46px;

    padding: 0 14px;

    border:
        1px solid #d1d5db;

    border-radius: 12px;

    background: white;

    color: #111827;

    font-size: 16px;

    outline: none;

    -webkit-appearance: none;
}

.search-box:focus {
    border-color: #6b7280;

    box-shadow:
        0 0 0 2px
        rgba(107,114,128,.15);
}


/* =====================================================
   BREADCRUMB
===================================================== */

.breadcrumb {
    display: flex;
    align-items: center;
    gap: 4px;

    /* Fit the breadcrumb bar to its actual content.
       It may scroll horizontally when the path is long. */
    width: fit-content;
    max-width: 100%;
    overflow-x: auto;
    overflow-y: hidden;

    white-space: nowrap;
    padding: 8px 10px;
    margin: 0;

    background: white;
    border-bottom: 1px solid #e5e7eb;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
}

.breadcrumb::-webkit-scrollbar {
    display: none;
}

.crumb {
    border: 0;

    background: transparent;

    color: #374151;

    font-size: 14px;

    padding: 7px 6px;

    border-radius: 7px;

    white-space: nowrap;

    touch-action: manipulation;
}

.crumb:active {
    background: #f3f4f6;
}

.crumb.current {
    font-weight: 700;

    color: #111827;
}


/* =====================================================
   MESSAGE
===================================================== */

.message {
    padding: 9px 12px;

    font-size: 13px;

    color: #6b7280;

    background: #f9fafb;

    border-bottom:
        1px solid #e5e7eb;
}


/* =====================================================
   REORDER BAR
===================================================== */

.reorder-bar {
    padding: 10px;

    background: #fff7ed;

    border-bottom:
        1px solid #fed7aa;
}

.reorder-info {
    display: flex;

    flex-direction: column;

    gap: 3px;

    margin-bottom: 8px;
}

.reorder-info strong {
    font-size: 14px;
}

.reorder-info span {
    font-size: 12px;

    color: #6b7280;
}

.reorder-actions {
    display: flex;

    gap: 8px;
}

.reorder-actions button {
    flex: 1;

    min-height: 44px;

    border: 0;

    border-radius: 9px;

    font-size: 14px;

    font-weight: 600;

    touch-action: manipulation;
}

.save-btn {
    background: #166534;

    color: white;
}

.cancel-btn {
    background: #991b1b;

    color: white;
}

.hidden {
    display: none !important;
}


/* =====================================================
   FILE LIST
===================================================== */

.file-list {
    width: 100%;
}


/* =====================================================
   FILE ITEM
===================================================== */

.file-item {
    display: grid;

    grid-template-columns:
        34px
        44px
        minmax(0,1fr)
        auto;

    align-items: center;

    gap: 8px;

    width: 100%;

    min-height: 70px;

    padding: 8px 10px;

    background: white;

    border-bottom:
        1px solid #e5e7eb;
}

.position {
    width: 30px;

    text-align: center;

    color: #9ca3af;

    font-size: 13px;

    font-weight: 600;
}

.file-icon {
    width: 42px;

    height: 42px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 28px;

    border-radius: 9px;

    background: #f9fafb;
}

.file-info {
    min-width: 0;

    overflow: hidden;
}

.file-name {
    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

    font-size: 15px;

    font-weight: 600;

    color: #111827;
}

.file-type {
    margin-top: 3px;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

    font-size: 11px;

    color: #9ca3af;
}


/* =====================================================
   ACTIONS
===================================================== */

.item-actions {
    display:flex !important;
    align-items:center;
    justify-content:flex-end;
    gap:6px;
    flex:0 0 auto;
    min-width:max-content;
    padding:0 !important;
    margin:0 !important;
    position:relative;
    z-index:20;
}

.item-btn {
    width:40px !important;
    height:40px !important;
    min-width:40px !important;
    min-height:40px !important;
    padding:0 !important;
    margin:0 !important;
    border:0;
    border-radius:12px;
    background:transparent;
    font-size:18px;
    line-height:1;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    cursor:pointer;
}

.item-btn:active {
    background:#e5e5ea;
    transform:scale(.94);
}

.file-item > .item-actions {
    flex-shrink:0 !important;
}

.file-item > .item-info, .file-item .item-info {
    min-width:0 !important;
    flex:1 1 auto !important;
}

.item-btn:active {
    background: #f3f4f6;

    transform: scale(.92);
}


/* =====================================================
   FOLDER
===================================================== */

.folder-row {
    cursor: pointer;
}

.folder-row:active {
    background: #f9fafb;
}


/* =====================================================
   REORDER
===================================================== */

.reorder-row {
    grid-template-columns:
        34px
        42px
        minmax(0,1fr)
        86px;
}

.reorder-buttons {
    display: flex;

    gap: 3px;
}

.move-btn {
    width: 40px;

    height: 40px;

    border:
        1px solid #d1d5db;

    border-radius: 8px;

    background: white;

    font-size: 18px;

    touch-action: manipulation;
}

.move-btn:active {
    background: #e5e7eb;

    transform: scale(.92);
}

.move-btn:disabled {
    opacity: .25;
}


/* =====================================================
   EMPTY
===================================================== */

.empty {
    padding: 60px 20px;

    text-align: center;

    color: #6b7280;
}

.empty-icon {
    font-size: 52px;

    margin-bottom: 12px;
}

.empty h2 {
    margin: 0 0 8px;

    font-size: 19px;

    color: #374151;
}

.empty p {
    margin: 0;

    font-size: 13px;
}


/* =====================================================
   SEARCH RESULT
===================================================== */

.search-result {
    cursor: pointer;
}

.search-path {
    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

    font-size: 11px;

    color: #9ca3af;

    margin-top: 3px;
}


/* =====================================================
   UPLOAD STATUS
===================================================== */

.upload-status {
    padding: 12px;

    background: #eff6ff;

    border-bottom:
        1px solid #bfdbfe;

    font-size: 13px;

    color: #1e40af;
}


/* =====================================================
   TABLET
===================================================== */

@media (min-width:600px) {

    .app {
        max-width: 800px;

        margin: 0 auto;

        box-shadow:
            0 0 20px
            rgba(0,0,0,.08);
    }

}


/* =====================================================
   SMALL PHONE
===================================================== */

@media (max-width:380px) {

    .toolbar {
        grid-template-columns:
            repeat(4,1fr);
    }

    .toolbar-btn {
        min-height: 54px;
    }

    .file-item {
        grid-template-columns:
            30px
            40px
            minmax(0,1fr)
            auto;
    }

    .item-btn {
        width: 34px;
    }

}


/* =====================================================
   MOBILE V4 — iOS STYLE MOTION / DEPTH
   No external libraries. Works in Android Chrome,
   iOS Safari and iOS Chrome.
===================================================== */
:root {
    --ios-blue: #0a84ff;
    --ios-bg: #f2f2f7;
    --ios-card: rgba(255,255,255,.94);
    --ios-border: rgba(60,60,67,.12);
    --ios-shadow: 0 10px 30px rgba(0,0,0,.08);
    --ios-spring: cubic-bezier(.22,1,.36,1);
}

html {
    scroll-behavior: smooth;
}

body {
    background:
        radial-gradient(circle at 50% -10%, rgba(10,132,255,.10), transparent 34%),
        var(--ios-bg);
}

.header {
    background:
        linear-gradient(145deg, #111827 0%, #1f2937 52%, #243447 100%);
    box-shadow: 0 5px 22px rgba(0,0,0,.16);
    position: relative;
    overflow: hidden;
}

.header::after {
    content: "";
    position: absolute;
    width: 180px;
    height: 180px;
    right: -80px;
    top: -100px;
    border-radius: 50%;
    background: rgba(10,132,255,.18);
    filter: blur(10px);
    pointer-events: none;
}

.app-logo {
    width: 56px;
    height: 56px;
    border-radius: 17px;
    background: rgba(255,255,255,.98);
    box-shadow:
        0 7px 20px rgba(0,0,0,.24),
        inset 0 0 0 1px rgba(255,255,255,.8);
    transform: translateZ(0);
    animation: v3LogoIn .65s var(--ios-spring) both;
}

.app-logo svg {
    width: 52px;
    height: 52px;
    overflow: visible;
}

.app-logo:hover {
    transform: scale(1.04) rotate(-1deg);
}

.brand-text {
    animation: v3TextIn .55s var(--ios-spring) .08s both;
}

.toolbar {
    background: rgba(255,255,255,.88);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    backdrop-filter: blur(18px) saturate(150%);
    box-shadow: 0 4px 16px rgba(0,0,0,.05);
}

.toolbar-btn {
    border-color: var(--ios-border);
    box-shadow: 0 2px 8px rgba(0,0,0,.035);
    transition:
        transform .18s var(--ios-spring),
        box-shadow .18s ease,
        background .18s ease,
        border-color .18s ease;
}

.toolbar-btn:active {
    transform: scale(.92);
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
}

.toolbar-btn:disabled {
    opacity: .42;
    transform: none;
}

.search-box {
    transition:
        transform .25s var(--ios-spring),
        box-shadow .25s ease,
        border-color .25s ease;
}

.search-box:focus {
    transform: translateY(-1px);
    border-color: rgba(10,132,255,.45);
    box-shadow: 0 0 0 4px rgba(10,132,255,.12), var(--ios-shadow);
    outline: none;
}

.breadcrumb {
    animation: v3FadeUp .35s var(--ios-spring) both;
}

.message {
    transition: opacity .25s ease, transform .25s var(--ios-spring);
}

.file-item {
    background: var(--ios-card);
    border-bottom-color: rgba(60,60,67,.09);
    transition:
        transform .22s var(--ios-spring),
        background .22s ease,
        box-shadow .22s ease,
        opacity .22s ease;
    animation: v3RowIn .42s var(--ios-spring) both;
    will-change: transform;
}

.file-item:active {
    transform: scale(.985);
    background: #eef6ff;
}

.file-item:hover {
    background: rgba(255,255,255,.98);
}

.file-icon {
    transition: transform .25s var(--ios-spring), filter .25s ease;
}

.file-item:active .file-icon {
    transform: scale(1.12) rotate(-3deg);
}

.folder-item .file-icon,
.reorder-row .file-icon {
    filter: drop-shadow(0 4px 5px rgba(10,132,255,.16));
}

.file-name {
    transition: color .2s ease;
}

.file-item:active .file-name {
    color: var(--ios-blue);
}

.position {
    font-variant-numeric: tabular-nums;
}

/* Smooth appearance when JS rebuilds the list. */
.file-list {
    contain: layout paint;
}

.file-item:nth-child(1) { animation-delay: .015s; }
.file-item:nth-child(2) { animation-delay: .03s; }
.file-item:nth-child(3) { animation-delay: .045s; }
.file-item:nth-child(4) { animation-delay: .06s; }
.file-item:nth-child(5) { animation-delay: .075s; }
.file-item:nth-child(6) { animation-delay: .09s; }
.file-item:nth-child(7) { animation-delay: .105s; }
.file-item:nth-child(8) { animation-delay: .12s; }
.file-item:nth-child(9) { animation-delay: .135s; }
.file-item:nth-child(10) { animation-delay: .15s; }

.save-btn,
.cancel-btn,
.reorder-btn,
button {
    transition: transform .18s var(--ios-spring), box-shadow .18s ease;
}

.save-btn:active,
.cancel-btn:active,
button:active {
    transform: scale(.96);
}

.empty {
    animation: v3FadeUp .45s var(--ios-spring) both;
}

.empty-icon {
    animation: v3Float 2.8s ease-in-out infinite;
}

@keyframes v3LogoIn {
    0% { opacity: 0; transform: scale(.72) rotate(-8deg); }
    65% { opacity: 1; transform: scale(1.06) rotate(1deg); }
    100% { opacity: 1; transform: scale(1) rotate(0); }
}

@keyframes v3TextIn {
    from { opacity: 0; transform: translateX(12px); }
    to { opacity: 1; transform: translateX(0); }
}

@keyframes v3RowIn {
    from { opacity: 0; transform: translateY(10px) scale(.985); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes v3FadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes v3Float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
}

/* Respect the phone's Reduce Motion setting. */
@media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }
}

/* Small screens: keep the iOS feel without making rows crowded. */
@media (max-width: 380px) {
    .app-logo { width: 50px; height: 50px; }
    .app-logo svg { width: 47px; height: 47px; }
    .brand-text h1 { font-size: 16px; }
    .brand-text p { font-size: 11px; }
    .toolbar { gap: 5px; padding: 8px; }
}

"use strict";


/* =====================================================
   ELEMENTS
===================================================== */

    document.getElementById("reorderBar");

const saveOrderBtn =
    document.getElementById("saveOrderBtn");

const cancelOrderBtn =
    document.getElementById("cancelOrderBtn");


/* =====================================================
   DATABASE
===================================================== */

const DB_NAME =
    "MobileFileManagerV2";

const DB_VERSION =
    1;

const STORE_NAME =
    "items";

let db = null;


/* =====================================================
   CURRENT LOCATION
===================================================== */

let currentFolderId =
    "root";

let folderStack = [
    {
        id: "root",
        name: "မူလ"
    }
];


/* =====================================================
   REORDER
===================================================== */

let reorderMode =
    false;

let originalOrder =
    [];

let workingOrder =
    [];

/* =====================================================
   SEARCH
===================================================== */

let searchTimer =
    null;


/* =====================================================
   ID
===================================================== */

function makeId() {

    return (
        Date.now().toString(36) +
        "-" +
        Math.random()
            .toString(36)
            .slice(2)
    );

}


/* =====================================================
   OPEN DATABASE
===================================================== */

function openDB() {

    return new Promise(
        (resolve, reject) => {

            const request =
                indexedDB.open(
                    DB_NAME,
                    DB_VERSION
                );


            request.onupgradeneeded =
                event => {

                    const database =
                        event.target.result;


                    if (
                        !database.objectStoreNames
                            .contains(STORE_NAME)
                    ) {

                        const store =
                            database.createObjectStore(
                                STORE_NAME,
                                {
                                    keyPath: "id"
                                }
                            );


                        store.createIndex(
                            "parentId",
                            "parentId",
                            {
                                unique: false
                            }
                        );

                    }

                };


            request.onsuccess =
                () => {

                    db =
                        request.result;

                    resolve(db);

                };


            request.onerror =
                () => {

                    reject(
                        request.error
                    );

                };

        }
    );

}


/* =====================================================
   STORE
===================================================== */

function getStore(
    mode = "readonly"
) {

    return db
        .transaction(
            STORE_NAME,
            mode
        )
        .objectStore(
            STORE_NAME
        );

}


/* =====================================================
   ADD
===================================================== */

function addItem(item) {

    return new Promise(
        (resolve, reject) => {

            const request =
                getStore(
                    "readwrite"
                ).add(item);


            request.onsuccess =
                () => resolve(item);


            request.onerror =
                () =>
                    reject(
                        request.error
                    );

        }
    );

}
/* =====================================================
   UPDATE ITEM
===================================================== */

function updateItem(item) {

    return new Promise(
        (resolve, reject) => {

            const request =
                getStore("readwrite").put(item);

            request.onsuccess =
                () => resolve(item);

            request.onerror =
                () =>
                    reject(
                        request.error
                    );

        }
    );

}
/* =====================================================
   FAVORITE
===================================================== */

async function toggleFavorite(item) {

    item.favorite =
        item.favorite === true
            ? false
            : true;

    await updateItem(item);

    await displayCurrentFolder();

}



/* =====================================================
   UPDATE
===================================================== */

function updateItem(item) {

    return new Promise(
        (resolve, reject) => {

            const request =
                getStore(
                    "readwrite"
                ).put(item);


            request.onsuccess =
                () => resolve(item);


            request.onerror =
                () =>
                    reject(
                        request.error
                    );

        }
    );

}


/* =====================================================
   GET
===================================================== */

function getItem(id) {

    return new Promise(
        (resolve, reject) => {

            const request =
                getStore().get(id);


            request.onsuccess =
                () =>
                    resolve(
                        request.result ||
                        null
                    );


            request.onerror =
                () =>
                    reject(
                        request.error
                    );

        }
    );

}


/* =====================================================
   GET ALL
===================================================== */

function getAllItems() {

    return new Promise(
        (resolve, reject) => {

            const request =
                getStore().getAll();


            request.onsuccess =
                () =>
                    resolve(
                        request.result
                    );


            request.onerror =
                () =>
                    reject(
                        request.error
                    );

        }
    );

}


/* =====================================================
   DELETE
===================================================== */

function deleteItem(id) {

    return new Promise(
        (resolve, reject) => {

            const request =
                getStore(
                    "readwrite"
                ).delete(id);


            request.onsuccess =
                () => resolve();


            request.onerror =
                () =>
                    reject(
                        request.error
                    );

        }
    );

}


/* =====================================================
   ROOT
===================================================== */

async function createRootIfNeeded() {

    const root =
        await getItem("root");


    if (!root) {

        await addItem({

            id: "root",

            parentId: null,

            type: "folder",

            name: "မူလ",

            position: 0,

            createdAt: Date.now()

        });

    }

}


/* =====================================================
   INITIALIZE
===================================================== */

async function initialize() {

    try {

        await openDB();

        await createRootIfNeeded();

        renderBreadcrumb();

        await displayCurrentFolder();

        message.textContent =
            "Mobile V4 အသင့်ဖြစ်ပါပြီ။";

    } catch (error) {

        console.error(error);

        message.textContent =
            "Database ဖွင့်၍ မရပါ။";

    }

}


/* =====================================================
   CHILDREN
===================================================== */

async function getChildren(
    parentId
) {

    const items =
        await getAllItems();


    return items.filter(
        item =>
            item.parentId ===
            parentId
    );

}


/* =====================================================
   SORT
===================================================== */

function sortItems(items) {

    return [...items].sort(
        (a,b) => {

            if (
                a.position !==
                b.position
            ) {

                return (
                    a.position -
                    b.position
                );

            }

            return a.name.localeCompare(
                b.name,
                "my"
            );

        }
    );

}


/* =====================================================
   NEXT POSITION
===================================================== */

async function getNextPosition(
    parentId
) {

    const children =
        await getChildren(
            parentId
        );


    if (!children.length) {

        return 0;

    }


    return (
        Math.max(
            ...children.map(
                item =>
                    Number(
                        item.position
                    ) || 0
            )
        ) + 1
    );

}


/* =====================================================
   DISPLAY
===================================================== */

async function displayCurrentFolder() {

    if (reorderMode) {
        return;
    }


    fileList.innerHTML =
        "";


    renderBreadcrumb();


    const children =
        await getChildren(
            currentFolderId
        );


    const sorted =
        sortItems(children);


    if (!sorted.length) {

        showEmpty();

        message.textContent =
            "ဤဖိုင်တွဲအတွင်း ဘာမျှမရှိပါ။";

        updateNavigation();

        return;

    }


    sorted.forEach(
        (item,index) => {

            createFileItem(
                item,
                index + 1
            );

        }
    );


    message.textContent =
        toMyanmarNumber(
            sorted.length
        ) +
        " ခု";


    updateNavigation();

}


/* =====================================================
   CREATE FILE ITEM
===================================================== */

function createFileItem(
    item,
    position
) {

    const row =
        document.createElement(
            "div"
        );


    row.className =
        "file-item";

    if (
        item.type === "folder"
    ) {

        row.classList.add(
            "folder-row"
        );

    }


    const number =
        document.createElement(
            "div"
        );

    number.className =
        "position";

    number.textContent =
        toMyanmarNumber(
            position
        );

    row.appendChild(number);


    const icon =
        document.createElement(
            "div"
        );

    icon.className =
        "file-icon";

    icon.textContent =
        item.type === "folder"
            ? "📁"
            : getIcon(item.name);

    row.appendChild(icon);


    const info =
        document.createElement(
            "div"
        );

    info.className =
        "file-info";


    const name =
        document.createElement(
            "div"
        );

    name.className =
        "file-name";

    name.textContent =
        item.name;


    info.appendChild(name);


    const type =
        document.createElement(
            "div"
        );

    type.className =
        "file-type";


    type.textContent =
        item.type === "folder"
            ? "ဖိုင်တွဲ"
            : getFileType(item.name);


    info.appendChild(type);

    row.appendChild(info);


    const actions =
    document.createElement(
        "div"
    );

actions.className =
    "item-actions";


/* =====================================================
   FAVORITE BUTTON
===================================================== */

const favoriteBtn =
    document.createElement(
        "button"
    );

favoriteBtn.className =
    "item-btn";

favoriteBtn.type =
    "button";

favoriteBtn.textContent =
    item.favorite === true
        ? "⭐"
        : "☆";

favoriteBtn.setAttribute(
    "aria-label",
    item.favorite === true
        ? "Remove Favorite"
        : "Add Favorite"
);

favoriteBtn.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        toggleFavorite(item);

    }
);

actions.appendChild(
    favoriteBtn
);


    const moreBtn =
        document.createElement(
            "button"
        );

    moreBtn.className =
        "item-btn item-more-btn";

    moreBtn.type = "button";
    moreBtn.setAttribute("aria-label", "More");
    moreBtn.innerHTML = "<span>•••</span>";

async function saveUploadedFile(
    file,
    parentId
) {

    const children =
        await getChildren(
            parentId
        );


    const existing =
        children.find(
            item =>
                item.name ===
                file.name
        );


    if (existing) {

        const overwrite =
            confirm(
                `"${file.name}" ရှိပြီးသားဖြစ်သည်။ အစားထိုးမလား?`
            );


        if (!overwrite) {
            return;
        }


        await deleteItemAndChildren(
            existing,
            false
        );

    }


    const position =
        await getNextPosition(
            parentId
        );


    await addItem({

        id: makeId(),

        parentId: parentId,

        type: "file",

        name: file.name,

        mime:
            file.type ||
            "application/octet-stream",

        size:
            file.size,

        blob:
            file,

        position:
            position,

        createdAt:
            Date.now()

    });

}

/* =====================================================
   UPLOAD WHOLE FOLDER
===================================================== */

async function uploadWholeFolder(
    files
) {

    showUploadStatus(
        "Folder ကို ဖတ်နေပါသည်..."
    );


    /*
     * webkitRelativePath example:
     *
     * Project A/Documents/a.pdf
     *
     * Project A/Documents/b.pdf
     *
     * Project A/Images/photo.jpg
     */


    const firstPath =
        files[0].webkitRelativePath ||
        files[0].name;


    let rootFolderName =
        firstPath.split("/")[0];


    /*
     * If browser does not provide
     * relative paths, we can only
     * upload the selected files.
     */

    const hasPaths =
        files.some(
            file =>
                !!file.webkitRelativePath
        );


    if (!hasPaths) {

        let count = 0;


        for (
            const file of files
        ) {

            await saveUploadedFile(
                file,
                currentFolderId
            );

            count++;

            showUploadStatus(
                `${count} / ${files.length} ဖိုင်`
            );

        }


        hideUploadStatus();

        await displayCurrentFolder();

        message.textContent =
            "ဖိုင်များ တင်ပြီးပါပြီ။";

        return;

    }


    /*
     * Create root folder.
     */

    const rootFolder =
        await getOrCreateFolder(
            currentFolderId,
            rootFolderName
        );


    let processed =
        0;


    for (
        const file of files
    ) {

        const relativePath =
            file.webkitRelativePath;


        /*
         * Example:
         *
         * Project A/
         * Documents/
         * file.pdf
         */

        const parts =
            relativePath.split("/");


        /*
         * Remove root folder name.
         */

        parts.shift();


        const fileName =
            parts.pop();


        let parentId =
            rootFolder.id;


        /*
         * Create all subfolders.
         */

        for (
            const folderName of parts
        ) {

            if (!folderName) {
                continue;
            }


            const folder =
                await getOrCreateFolder(
                    parentId,
                    folderName
                );


            parentId =
                folder.id;

        }


        /*
         * Save actual file.
         */

        await saveUploadedFile(
            file,
            parentId
        );


        processed++;


        showUploadStatus(
            `${processed} / ${files.length} ဖိုင် သိမ်းနေပါသည်...`
        );

    }


    hideUploadStatus();


    await displayCurrentFolder();


    message.textContent =
        `📂 ${rootFolderName} Folder ကို ` +
        `${toMyanmarNumber(processed)} ဖိုင်နှင့်အတူ တင်ပြီးပါပြီ။`;

}

async function getOrCreateFolder(
    parentId,
    name
) {

    const children =
        await getChildren(
            parentId
        );


    const existing =
        children.find(
            item =>
                item.type === "folder" &&
                item.name === name
        );


    if (existing) {

        return existing;

    }


    const position =
        await getNextPosition(
            parentId

    const folder = {

        id: makeId(),

        parentId: parentId,

        type: "folder",

        name: name,

        position: position,

        createdAt:
            Date.now()

    };


    await addItem(folder);


    return folder;

}

/* =====================================================
   OPEN FILE
===================================================== */

async function openFile(
    item
) {

    try {

        if (!item.blob) {

            alert(
                "ဤဖိုင်၏ data မတွေ့ပါ။"
            );

            return;

        }


        const blob =
            item.blob instanceof Blob
                ? item.blob
                : new Blob(
                    [item.blob],
                    {
                        type:
                            item.mime ||
                            "application/octet-stream"
                    }
                );


        const url =
            URL.createObjectURL(
                blob
            );


        const newWindow =
            window.open(
                url,
                "_blank"
            );


        if (!newWindow) {

            const link =
                document.createElement(
                    "a"
                );


            link.href =
                url;


            link.download =
                item.name;


            link.textContent =
                "ဖိုင်ဖွင့်ရန် ဒီနေရာကိုနှိပ်ပါ";


            link.style.position =
                "fixed";

            link.style.left =
                "20px";

            link.style.right =
                "20px";

            link.style.bottom =
                "20px";

            link.style.padding =
                "16px";

            link.style.background =
                "#111827";

            link.style.color =
                "white";

            link.style.textAlign =
                "center";

            link.style.borderRadius =
                "10px";

            link.style.zIndex =
                "9999";


            document.body.appendChild(
                link
            );


            setTimeout(
                () => {

                    if (
                        link.parentNode
                    ) {

                        link.remove();

                    }

                },
                15000
            );

        }


        setTimeout(
            () => {

                URL.revokeObjectURL(
                    url
                );

            },
            60000
        );


    } catch (error) {

        console.error(error);

        alert(
            "ဖိုင်ဖွင့်၍ မရပါ။\n\n" +
            error.message
        );

    }

}

async function renameItem(
    item
) {

    if (reorderMode) {
        return;
    }


    const input =
        prompt(
            "အမည်အသစ် ထည့်ပါ:",
            item.name
        );


    if (input === null) {
        return;
    }


    const newName =
        input.trim();


    if (
        !newName ||
        newName === item.name
    ) {
        return;
    }


    if (
        newName.includes("/") ||
        newName.includes("\\")
    ) {

        alert(
            "/ နှင့် \\ မသုံးရပါ။"
        );

        return;

    }


    const children =
        await getChildren(
            currentFolderId
        );


    const duplicate =
        children.some(
            other =>
                other.id !== item.id &&
                other.name
                    .toLowerCase() ===
                newName.toLowerCase()
        );


    if (duplicate) {

        alert(
            "ဤအမည်ရှိ ဖိုင် သို့မဟုတ် ဖိုင်တွဲ ရှိပြီးသားဖြစ်သည်။"
        );

        return;

    }


    item.name =
        newName;


    await updateItem(item);


    await displayCurrentFolder();

}


/* =====================================================
   DELETE
===================================================== */

async function deleteItemAndChildren(
    item,
    ask = true
) {

    if (reorderMode) {
        return;
    }


    if (ask) {

        const confirmed =
            confirm(
                `"${item.name}" ကို ဖျက်မလား?`
            );


        if (!confirmed) {
            return;
        }

    }


    const all =
        await getAllItems();


    const ids =
        new Set([
            item.id
        ]);


    let changed =
        true;


    while (changed) {

        changed =
            false;


        for (
            const candidate of all
        ) {

            if (
                ids.has(
                    candidate.parentId
                ) &&
                !ids.has(
                    candidate.id
                )
            ) {

                ids.add(
                    candidate.id
                );

                changed =
                    true;

            }

        }

    }


    for (
        const id of ids
    ) {

        await deleteItem(id);

    }


    if (ask) {

        await displayCurrentFolder();

    }

}


/* =====================================================
   iOS-STYLE THREE-DOT COPY / CUT / PASTE MENU
===================================================== */
let actionMenuItemId = null;
let clipboardItems = [];
let clipboardMode = null; // "copy" or "cut"

async function openItemActionMenu(itemId, anchorEl){
    actionMenuItemId = itemId;
    const item = await getItem(itemId);
    if(!item){ actionMenuItemId=null; return; }
    const title = document.getElementById("touchMenuTitle");
    if(title) title.textContent = item.name;
    const copy = document.getElementById("touchCopyAction");
    const cut = document.getElementById("touchCutAction");
    const paste = document.getElementById("touchPasteAction");
    if(copy) copy.textContent = "ကူး";
    if(cut) { cut.textContent = "ဖြတ်"; cut.style.display = "block"; }
    if(paste) paste.style.display = "none";
    const sheet=document.getElementById("touchActionSheet");
    if(sheet){
        sheet.classList.add("show");
        sheet.setAttribute("aria-hidden","false");
        positionTouchMenu(anchorEl, sheet);
    }
    if(navigator.vibrate) navigator.vibrate(8);
}
function positionTouchMenu(anchorEl, sheet){
    const card = sheet ? sheet.querySelector(".touch-sheet-card") : null;
    if(!card || !anchorEl) return;

    // Wait one frame so the card has its real size before positioning.
    requestAnimationFrame(() => {
        const r = anchorEl.getBoundingClientRect();
        const w = card.offsetWidth;
        const h = card.offsetHeight;
        const gap = 8;
        const margin = 10;
        const vw = window.innerWidth;
        const vh = window.innerHeight;

        // Prefer above the ••• button, like an iOS contextual menu.
        let top = r.top - h - gap;
        if(top < margin) top = r.bottom + gap;
        if(top + h > vh - margin) top = Math.max(margin, vh - h - margin);

        // Keep the popup horizontally inside the viewport.
        let left = r.right - w;
        if(left < margin) left = margin;
        if(left + w > vw - margin) left = vw - w - margin;

        // Center the popup on the screen.
        card.style.left = "50%";
        card.style.top = "50%";
        card.style.right = "auto";
        card.style.bottom = "auto";
        card.style.margin = "0";
        card.style.transform = "translate(-50%, -50%)";
    });
}

function closeTouchMenu(){
    const sheet=document.getElementById("touchActionSheet");
    if(sheet){ sheet.classList.remove("show"); sheet.setAttribute("aria-hidden","true"); }
    actionMenuItemId=null;
}

function setClipboard(itemId, mode){
    clipboardItems=[itemId];
    clipboardMode=mode;
    updatePasteFab();
    if(navigator.vibrate) navigator.vibrate([10,30,10]);
}

async function copyLongPressedItem(){
    if(!actionMenuItemId) return;
    const item=await getItem(actionMenuItemId);
    setClipboard(actionMenuItemId,"copy");
    closeTouchMenu();
    message.textContent=(item?item.name:"ဖိုင်")+" ကို ကူးယူထားပါပြီ။ Destination folder သို့သွားပြီး ကပ်ပါ။";
}

async function cutItemFromMenu(){

}

function getUniqueName(name, existingNames){
    if(!existingNames.has(name.toLowerCase())) return name;
    const dot=name.lastIndexOf(".");
    const base=dot>0?name.slice(0,dot):name;
    const ext=dot>0?name.slice(dot):"";
    let n=1, candidate;
    do { candidate=`${base} (${n})${ext}`; n++; } while(existingNames.has(candidate.toLowerCase()));
    return candidate;
}

async function cloneItemTree(sourceId, destinationParentId){
    const all=await getAllItems();
    const source=all.find(x=>x.id===sourceId);
    if(!source) throw new Error("ကူးထားသော ဖိုင်/ဖိုင်တွဲ မရှိပါ။");
    const children=all.filter(x=>x.parentId===sourceId);
    const destinationChildren=all.filter(x=>x.parentId===destinationParentId);
    const names=new Set(destinationChildren.map(x=>x.name.toLowerCase()));
    const rootCopy={...source,id:makeId(),parentId:destinationParentId,name:getUniqueName(source.name,names),position:await getNextPosition(destinationParentId),createdAt:Date.now()};
    names.add(rootCopy.name.toLowerCase());
    await addItem(rootCopy);
    if(source.type==="folder") {
        for(const child of children) await cloneItemTree(child.id,rootCopy.id);
    }
    return rootCopy;
}

async function isDescendantFolder(sourceId, possibleParentId){
    if(sourceId===possibleParentId) return true;
    let cur=await getItem(possibleParentId);
    while(cur && cur.parentId){
        if(cur.parentId===sourceId) return true;
        cur=await getItem(cur.parentId);
    }
    return false;
}

async function pasteClipboardItems(){
    if(!clipboardItems.length || reorderMode) return;
    try{
        const source=await getItem(clipboardItems[0]);
        if(!source){ alert("ကူး/ဖြတ်ထားသော ဖိုင် မရှိပါ။"); return; }
        if(source.type==="folder" && await isDescendantFolder(source.id,currentFolderId)){
            alert("ဖိုင်တွဲကို ၎င်း၏အတွင်းပိုင်းထဲသို့ ကပ်၍ မရပါ။");
            return;
        }
        showUploadStatus(clipboardMode==="cut"?"ဖိုင်ကို ရွှေ့နေပါသည်...":"ဖိုင်ကို ကူးနေပါသည်...");
        if(clipboardMode==="cut") {
            const children=await getChildren(currentFolderId);
            const existing=children.find(x=>x.name.toLowerCase()===source.name.toLowerCase() && x.id!==source.id);
            if(existing) { source.name=getUniqueName(source.name,new Set(children.filter(x=>x.id!==existing.id).map(x=>x.name.toLowerCase()))); }
            source.parentId=currentFolderId;
            source.position=await getNextPosition(currentFolderId);
            await updateItem(source);
            clipboardItems=[]; clipboardMode=null;
        } else {
            await cloneItemTree(source.id,currentFolderId);
            // Copy is a one-time paste action. Clear the clipboard after a successful paste.
            clipboardItems=[];
            clipboardMode=null;
        }
        hideUploadStatus();
        closeTouchMenu();
        // Paste completed: clear the clipboard so the Paste button disappears.
        clipboardItems = [];
        clipboardMode = null;
        actionMenuItemId = null;
        updatePasteFab();
        await displayCurrentFolder();
        message.textContent="ကပ်ပြီးပါပြီ။";
    }catch(error){
        hideUploadStatus(); console.error(error); alert("ကပ်၍ မရပါ။\n\n"+error.message);
    }
}

    }
}

async function getItemPath(
    item
) {

    const all =
        await getAllItems();


    const map =
        new Map();


    all.forEach(
        current => {

            map.set(
                current.id,
                current
            );

        }
    );


    const parts = [];


    let current =
        item;


    while (
        current &&
        current.id !== "root"
    ) {

        parts.unshift(
            current.name
        );


        current =
            map.get(
                current.parentId
            );

    }


    return (
        "မူလ / " +
        parts.join(" / ")
    );

}


/* =====================================================
   OPEN SEARCH FOLDER
===================================================== */

async function openSearchFolder(
    folder
) {

    const all =
        await getAllItems();


    const map =
        new Map();


    all.forEach(
        item => {

            map.set(
                item.id,
                item
            );

        }
    );


    const path = [];


    let current =
        folder;


    while (current) {

        path.unshift({

            id:
                current.id,

            name:
                current.name

        });


        if (
            current.id === "root"
        ) {
            break;
        }


        current =
            map.get(
                current.parentId
            );

    }


    folderStack =
        path;


    currentFolderId =
        folder.id;


    searchBox.value =
        "";


    await displayCurrentFolder();

}

    name
) {

    const dot =
        name.lastIndexOf(".");


    if (dot === -1) {
        return "ဖိုင်";
    }


    return (
        name
            .slice(dot + 1)
            .toUpperCase() +
        " ဖိုင်"
    );

}

    name
) {

    const parts =
        name.split(".");


    const ext =
        parts.length > 1
            ? parts
                .pop()
                .toLowerCase()
            : "";


    const icons = {

        pdf: "📕",

        doc: "📘",
        docx: "📘",

        xls: "📗",
        xlsx: "📗",

        ppt: "📙",

        csv: "📊",

        html: "🌐",

        css: "🎨",

        js: "🧩",

        json: "📋",

        jpg: "🖼️",
        jpeg: "🖼️",
        png: "🖼️",
        gif: "🖼️",
        webp: "🖼️",
        svg: "🖼️",

        mp3: "🎵",
        wav: "🎵",
        flac: "🎵",

    return (

/* =====================================================
   MYANMAR NUMBERS
===================================================== */

function toMyanmarNumber(
    value
) {

    const digits = [
        "၀",
        "၁",
        "၂",
        "၃",
        "၄",
        "၅",
        "၆",
        "၇",
        "၈",
        "၉"
    ];


    return String(
        value
    ).replace(
        /\d/g,
        digit =>
            digits[
                Number(digit)
            ]
    );

}

<script id="touch-screen-v4-js">
/* =====================================================
   TOUCH FEEDBACK
   Uses Pointer Events so Android Chrome and iOS Safari
   get the same finger-press behavior.
===================================================== */
(function initTouchScreenMode(){
  const selector = 'button,.file-item';

  function addPress(el){
    if(el && !el.disabled) el.classList.add('touch-active');
  }
  function removePress(el){
    if(el) el.classList.remove('touch-active');
  }

  document.addEventListener('pointerdown', function(e){
    const el=e.target.closest(selector);
    if(!el || el.disabled) return;
    addPress(el);
  }, {passive:true});

  ['pointerup','pointercancel','pointerleave','blur'].forEach(type=>{
    document.addEventListener(type,function(e){
      const el=e.target && e.target.closest ? e.target.closest(selector) : null;
      removePress(el);
    }, {passive:true});
  });

  /* Small Android haptic response where supported. iOS simply ignores it. */
  document.addEventListener('click',function(e){
    const el=e.target.closest('button');
    if(!el || el.disabled) return;
    if(navigator.vibrate) navigator.vibrate(8);
  }, {passive:true});

  /* Make the horizontal navigation bar easy to swipe with one finger. */
  const toolbar=document.getElementById('mainToolbar');
  if(toolbar){
    toolbar.addEventListener('wheel',function(e){
      if(window.innerWidth<=700 && Math.abs(e.deltaY)>Math.abs(e.deltaX)){
        toolbar.scrollLeft += e.deltaY;
      }
    }, {passive:true});
  }
})();
</script>

<script id="mobile-v4-pwa-diagnostic">
/* =====================================================
   MOBILE V4 PWA DIAGNOSTIC V11
   Normal UI is unchanged. Add ?diagnose=1 to the URL to
   open the PWA diagnostic panel.
===================================================== */
(function () {
  'use strict';
  const DIAG_MODE = new URLSearchParams(location.search).get('diagnose') === '1';

  function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function stateLabel(reg) {
    if (!reg) return 'not registered';
    const worker = reg.active || reg.waiting || reg.installing;
    return worker ? worker.state : 'registered, no worker state yet';
  }

  async function inspectPWA() {
    const rows = [];
    rows.push(['URL', location.href]);
    rows.push(['Origin', location.origin]);
    rows.push(['Protocol', location.protocol]);
    rows.push(['Secure context', String(window.isSecureContext)]);
    rows.push(['Service Worker API', String('serviceWorker' in navigator)]);
    rows.push(['Controller', navigator.serviceWorker?.controller ? 'YES' : 'NO (reload may be required)']);

    let reg = null;
    if ('serviceWorker' in navigator) {
      try {
        reg = await navigator.serviceWorker.getRegistration('./');
        if (!reg) reg = await navigator.serviceWorker.getRegistration();
        rows.push(['Registration', reg ? 'FOUND' : 'NOT FOUND']);
        if (reg) {
          rows.push(['Scope', reg.scope]);
          rows.push(['Worker state', stateLabel(reg)]);
          rows.push(['UpdateViaCache', reg.updateViaCache || 'browser default']);
          try { await reg.update(); rows.push(['Update check', 'OK / requested']); }
          catch (e) { rows.push(['Update check', 'FAILED: ' + (e.message || e)]); }
        }
      } catch (e) {
        rows.push(['Registration check', 'ERROR: ' + (e.message || e)]);
      }
    }

    try {
      const r = await fetch('./manifest.json', {cache:'no-store'});
      rows.push(['manifest.json', r.ok ? 'HTTP ' + r.status : 'HTTP ' + r.status + ' FAILED']);
    } catch (e) { rows.push(['manifest.json', 'FETCH FAILED: ' + (e.message || e)]); }

    try {
      const r = await fetch('./sw.js', {cache:'no-store'});
      rows.push(['sw.js', r.ok ? 'HTTP ' + r.status : 'HTTP ' + r.status + ' FAILED']);
    } catch (e) { rows.push(['sw.js', 'FETCH FAILED: ' + (e.message || e)]); }

    if ('caches' in window) {
      try {
        const names = await caches.keys();
        rows.push(['Cache Storage', names.length ? names.join(', ') : 'EMPTY']);
      } catch (e) { rows.push(['Cache Storage', 'ERROR: ' + (e.message || e)]); }
    } else rows.push(['Cache Storage API', 'NOT AVAILABLE']);

    const panel = document.getElementById('v11DiagBody');
    if (panel) panel.innerHTML = rows.map(([k,v]) => '<div class="v11-row"><b>'+esc(k)+'</b><span>'+esc(v)+'</span></div>').join('');
    const now = document.getElementById('v11DiagTime');
    if (now) now.textContent = new Date().toLocaleString();
  }

  function showDiagnosticPanel() {
    if (!DIAG_MODE || document.getElementById('v11PwaDiag')) return;
    const panel = document.createElement('section');
    panel.id = 'v11PwaDiag';
    panel.innerHTML = '<div class="v11-diag-head"><strong>PWA Diagnostic V11</strong><button id="v11DiagClose" type="button">×</button></div>' +
      '<div id="v11DiagBody" class="v11-diag-body">Checking…</div>' +
      '<div class="v11-diag-foot"><span id="v11DiagTime"></span><button id="v11DiagRefresh" type="button">Refresh</button></div>';
    document.body.appendChild(panel);
    document.getElementById('v11DiagClose').onclick = () => panel.remove();
    document.getElementById('v11DiagRefresh').onclick = inspectPWA;
    inspectPWA();
  }

  async function registerAppWorker() {
    if (!('serviceWorker' in navigator)) {
      console.warn('[Mobile V4 PWA] Service Worker API is unavailable.');
      if (DIAG_MODE) showDiagnosticPanel();
      return;
    }
    if (!window.isSecureContext) {
      console.warn('[Mobile V4 PWA] Not a secure context. HTTPS must be trusted, or use localhost.');
      if (DIAG_MODE) showDiagnosticPanel();
      return;
    }
    try {
      const reg = await navigator.serviceWorker.register('./sw.js', {
  scope: './',
  updateViaCache: 'none'
});
      console.log('[Mobile V4 PWA] Service worker registration:', reg.scope);
      try { await reg.update(); } catch (e) { console.warn('[Mobile V4 PWA] update() failed:', e); }
      if (DIAG_MODE) inspectPWA();
    } catch (err) {
      console.error('[Mobile V4 PWA] registration FAILED:', err);
      if (DIAG_MODE) inspectPWA();
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => { registerAppWorker(); showDiagnosticPanel(); }, {once:true});
  } else {
    registerAppWorker();
    showDiagnosticPanel();
  }
})();
</script>
