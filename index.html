<script>

"use strict";


/* =====================================================
   ELEMENTS
===================================================== */

const homeBtn =
    document.getElementById("homeBtn");

const upBtn =
    document.getElementById("upBtn");

const newFolderBtn =
    document.getElementById("newFolderBtn");

const uploadBtn =
    document.getElementById("uploadBtn");

const uploadFolderBtn =
    document.getElementById("uploadFolderBtn");

const reorderBtn =
    document.getElementById("reorderBtn");


const refreshBtn =
    document.getElementById("refreshBtn");

const searchBox =
    document.getElementById("searchBox");

const breadcrumb =
    document.getElementById("breadcrumb");

const message =
    document.getElementById("message");

const fileList =
    document.getElementById("fileList");

const fileInput =
    document.getElementById("fileInput");

const folderInput =
    document.getElementById("folderInput");

const uploadStatus =
    document.getElementById("uploadStatus");

const reorderBar =
    document.getElementById("reorderBar");

const saveOrderBtn =
    document.getElementById("saveOrderBtn");

const cancelOrderBtn =
    document.getElementById("cancelOrderBtn");


/* =====================================================
   DATABASE
===================================================== */

const DB_NAME =
    "MobileFileManagerV2";

const DB_VERSION =
    1;

const STORE_NAME =
    "items";

let db = null;


/* =====================================================
   CURRENT LOCATION
===================================================== */

let currentFolderId =
    "root";

let folderStack = [
    {
        id: "root",
        name: "မူလ"
    }
];


/* =====================================================
   REORDER
===================================================== */

let reorderMode =
    false;

let originalOrder =
    [];

let workingOrder =
    [];

/* =====================================================
   SEARCH
===================================================== */

let searchTimer =
    null;


/* =====================================================
   ID
===================================================== */

function makeId() {

    return (
        Date.now().toString(36) +
        "-" +
        Math.random()
            .toString(36)
            .slice(2)
    );

}


/* =====================================================
   OPEN DATABASE
===================================================== */

function openDB() {

    return new Promise(
        (resolve, reject) => {

            const request =
                indexedDB.open(
                    DB_NAME,
                    DB_VERSION
                );


            request.onupgradeneeded =
                event => {

                    const database =
                        event.target.result;


                    if (
                        !database.objectStoreNames
                            .contains(STORE_NAME)
                    ) {

                        const store =
                            database.createObjectStore(
                                STORE_NAME,
                                {
                                    keyPath: "id"
                                }
                            );


                        store.createIndex(
                            "parentId",
                            "parentId",
                            {
                                unique: false
                            }
                        );

                    }

                };


            request.onsuccess =
                () => {

                    db =
                        request.result;

                    resolve(db);

                };


            request.onerror =
                () => {

                    reject(
                        request.error
                    );

                };

        }
    );

}


/* =====================================================
   STORE
===================================================== */

function getStore(
    mode = "readonly"
) {

    return db
        .transaction(
            STORE_NAME,
            mode
        )
        .objectStore(
            STORE_NAME
        );

}


/* =====================================================
   ADD
===================================================== */

function addItem(item) {

    return new Promise(
        (resolve, reject) => {

            const request =
                getStore(
                    "readwrite"
                ).add(item);


            request.onsuccess =
                () => resolve(item);


            request.onerror =
                () =>
                    reject(
                        request.error
                    );

        }
    );

}


/* =====================================================
   UPDATE
===================================================== */

function updateItem(item) {

    return new Promise(
        (resolve, reject) => {

            const request =
                getStore(
                    "readwrite"
                ).put(item);


            request.onsuccess =
                () => resolve(item);


            request.onerror =
                () =>
                    reject(
                        request.error
                    );

        }
    );

}
async function toggleFavorite(item) {

    item.favorite = item.favorite === true
        ? false
        : true;

    await updateItem(item);

    await displayCurrentFolder();
}

/* =====================================================
   GET
===================================================== */

function getItem(id) {

    return new Promise(
        (resolve, reject) => {

            const request =
                getStore().get(id);


            request.onsuccess =
                () =>
                    resolve(
                        request.result ||
                        null
                    );


            request.onerror =
                () =>
                    reject(
                        request.error
                    );

        }
    );

}


/* =====================================================
   GET ALL
===================================================== */

function getAllItems() {

    return new Promise(
        (resolve, reject) => {

            const request =
                getStore().getAll();


            request.onsuccess =
                () =>
                    resolve(
                        request.result
                    );


            request.onerror =
                () =>
                    reject(
                        request.error
                    );

        }
    );

}


/* =====================================================
   DELETE
===================================================== */

function deleteItem(id) {

    return new Promise(
        (resolve, reject) => {

            const request =
                getStore(
                    "readwrite"
                ).delete(id);


            request.onsuccess =
                () => resolve();


            request.onerror =
                () =>
                    reject(
                        request.error
                    );

        }
    );

}


/* =====================================================
   ROOT
===================================================== */

async function createRootIfNeeded() {

    const root =
        await getItem("root");


    if (!root) {

        await addItem({

            id: "root",

            parentId: null,

            type: "folder",

            name: "မူလ",

            position: 0,

            createdAt: Date.now()

        });

    }

}


/* =====================================================
   INITIALIZE
===================================================== */

async function initialize() {

    try {

        await openDB();

        await createRootIfNeeded();

        renderBreadcrumb();

        await displayCurrentFolder();

        message.textContent =
            "Mobile V4 အသင့်ဖြစ်ပါပြီ။";

    } catch (error) {

        console.error(error);

        message.textContent =
            "Database ဖွင့်၍ မရပါ။";

    }

}


/* =====================================================
   CHILDREN
===================================================== */

async function getChildren(
    parentId
) {

    const items =
        await getAllItems();


    return items.filter(
        item =>
            item.parentId ===
            parentId
    );

}


/* =====================================================
   SORT
===================================================== */

function sortItems(items) {

    return [...items].sort(
        (a,b) => {

            if (
                a.position !==
                b.position
            ) {

                return (
                    a.position -
                    b.position
                );

            }

            return a.name.localeCompare(
                b.name,
                "my"
            );

        }
    );

}


/* =====================================================
   NEXT POSITION
===================================================== */

async function getNextPosition(
    parentId
) {

    const children =
        await getChildren(
            parentId
        );


    if (!children.length) {

        return 0;

    }


    return (
        Math.max(
            ...children.map(
                item =>
                    Number(
                        item.position
                    ) || 0
            )
        ) + 1
    );

}


/* =====================================================
   DISPLAY
===================================================== */

async function displayCurrentFolder() {

    if (reorderMode) {
        return;
    }


    fileList.innerHTML =
        "";


    renderBreadcrumb();


    const children =
        await getChildren(
            currentFolderId
        );


    const sorted =
        sortItems(children);


    if (!sorted.length) {

        showEmpty();

        message.textContent =
            "ဤဖိုင်တွဲအတွင်း ဘာမျှမရှိပါ။";

        updateNavigation();

        return;

    }


    sorted.forEach(
        (item,index) => {

            createFileItem(
                item,
                index + 1
            );

        }
    );


    message.textContent =
        toMyanmarNumber(
            sorted.length
        ) +
        " ခု";


    updateNavigation();

}


/* =====================================================
   CREATE FILE ITEM
===================================================== */

function createFileItem(
    item,
    position
) {

    const row =
        document.createElement(
            "div"
        );


    row.className =
        "file-item";

    if (
        item.type === "folder"
    ) {

        row.classList.add(
            "folder-row"
        );

    }


    const number =
        document.createElement(
            "div"
        );

    number.className =
        "position";

    number.textContent =
        toMyanmarNumber(
            position
        );

    row.appendChild(number);


    const icon =
        document.createElement(
            "div"
        );

    icon.className =
        "file-icon";

    icon.textContent =
        item.type === "folder"
            ? "📁"
            : getIcon(item.name);

    row.appendChild(icon);


    const info =
        document.createElement(
            "div"
        );

    info.className =
        "file-info";


    const name =
    document.createElement(
        "div"
    );

name.className =
    "file-name";

const nameText =
    document.createElement(
        "span"
    );

nameText.className =
    "file-name-text";

nameText.textContent =
    item.name;

name.appendChild(nameText);

info.appendChild(name);


    const type =
        document.createElement(
            "div"
        );

    type.className =
        "file-type";


    type.textContent =
        item.type === "folder"
            ? "ဖိုင်တွဲ"
            : getFileType(item.name);


    info.appendChild(type);

    row.appendChild(info);


    const actions =
        document.createElement(
            "div"
        );

    actions.className =
        "item-actions";
    const detailsBtn = document.createElement("button");

detailsBtn.className = "item-btn";
detailsBtn.type = "button";
detailsBtn.textContent = "ⓘ";

detailsBtn.setAttribute(
    "aria-label",
    "Details"
);

detailsBtn.addEventListener(
    "click",
    event => {
        event.stopPropagation();
        showFileDetails(item);
    }
);

actions.appendChild(detailsBtn);
    const favoriteBtn = document.createElement("button");

favoriteBtn.type = "button";

favoriteBtn.textContent =
    item.favorite === true
        ? "⭐"
        : "☆";

favoriteBtn.style.display = "inline-flex";
favoriteBtn.style.width = "40px";
favoriteBtn.style.height = "40px";
favoriteBtn.style.alignItems = "center";
favoriteBtn.style.justifyContent = "center";
favoriteBtn.style.fontSize = "22px";
favoriteBtn.style.border = "none";
favoriteBtn.style.background = "transparent";
favoriteBtn.style.cursor = "pointer";
favoriteBtn.setAttribute("aria-label", "Add Favorite");

favoriteBtn.addEventListener("click", async event => {
    event.stopPropagation();

    await toggleFavorite(item);
});
actions.appendChild(favoriteBtn);


    const moreBtn =
        document.createElement(
            "button"
        );

    moreBtn.className =
        "item-btn item-more-btn";

    moreBtn.type = "button";
    moreBtn.setAttribute("aria-label", "More");
    moreBtn.innerHTML = "<span>•••</span>";

    const openMoreMenu = (event) => {
        event.preventDefault();
        event.stopPropagation();
        if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        openItemActionMenu(item.id, event.currentTarget);
        return false;
    };
    moreBtn.addEventListener("click", openMoreMenu);
    moreBtn.addEventListener("pointerup", (event) => {
        if (event.pointerType === "touch") openMoreMenu(event);
    });

    actions.appendChild(moreBtn);


    const renameBtn =
        document.createElement(
            "button"
        );

    renameBtn.className =
        "item-btn";

    renameBtn.type =
        "button";

    renameBtn.textContent =
        "✏️";


    renameBtn.addEventListener(
        "click",
        event => {

            event.stopPropagation();

            renameItem(item);

        }
    );


    actions.appendChild(
        renameBtn
    );


    const deleteBtn =
        document.createElement(
            "button"
        );

    deleteBtn.className =
        "item-btn";

    deleteBtn.type =
        "button";

    deleteBtn.textContent =
        "🗑️";


    deleteBtn.addEventListener(
        "click",
        event => {

            event.stopPropagation();

            deleteItemAndChildren(
                item
            );

        }
    );


    actions.appendChild(
        deleteBtn
    );


    row.appendChild(actions);


    row.addEventListener(
        "click",
        () => {

            if (
                item.type === "folder"
            ) {

                openFolder(item);

            } else {

                openFile(item);

            }

        }
    );


    attachLongPress(row,item);
fileList.appendChild(row);

requestAnimationFrame(() => {

    if (
        window.innerWidth <= 600 &&
        nameText.scrollWidth > name.clientWidth
    ) {

        const distance =
            nameText.scrollWidth -
            name.clientWidth;

        name.style.setProperty(
            "--marquee-distance",
            "-" + distance + "px"
        );

        name.classList.add(
            "marquee"
        );
    }

});

}


/* =====================================================
   OPEN FOLDER
===================================================== */

async function openFolder(
    folder
) {

    if (reorderMode) {
        return;
    }


    currentFolderId =
        folder.id;


    folderStack.push({

        id: folder.id,

        name: folder.name

    });


    await displayCurrentFolder();

}


/* =====================================================
   HOME
===================================================== */

homeBtn.addEventListener(
    "click",
    async () => {

        if (reorderMode) {
            return;
        }


        currentFolderId =
            "root";


        folderStack = [
            {
                id: "root",
                name: "မူလ"
            }
        ];


        searchBox.value =
            "";


        await displayCurrentFolder();

    }
);
favoritesBtn.addEventListener(
    "click",
    () => {
        displayFavorites();
    }
);
recentBtn.addEventListener(
    "click",
    () => {
        displayRecentDocuments();
    }
);

/* =====================================================
   UP
===================================================== */

upBtn.addEventListener(
    "click",
    async () => {

        if (reorderMode) {
            return;
        }


        if (
            folderStack.length <= 1
        ) {
            return;
        }


        folderStack.pop();


        const parent =
            folderStack[
                folderStack.length - 1
            ];


        currentFolderId =
            parent.id;


        await displayCurrentFolder();

    }
);


/* =====================================================
   NAVIGATION
===================================================== */

function updateNavigation() {

    upBtn.disabled =
        folderStack.length <= 1;

}

async function saveUploadedFile(
    file,
    parentId
) {

    const children =
        await getChildren(
            parentId
        );


    const existing =
        children.find(
            item =>
                item.name ===
                file.name
        );


    if (existing) {

        const overwrite =
            confirm(
                `"${file.name}" ရှိပြီးသားဖြစ်သည်။ အစားထိုးမလား?`
            );


        if (!overwrite) {
            return;
        }


        await deleteItemAndChildren(
            existing,
            false
        );

    }


    const position =
        await getNextPosition(
            parentId
        );


    await addItem({

        id: makeId(),

        parentId: parentId,

        type: "file",

        name: file.name,

        mime:
            file.type ||
            "application/octet-stream",

        size:
            file.size,

        blob:
            file,

        position:
            position,

        createdAt:
            Date.now()

    });

}

/* =====================================================
   UPLOAD WHOLE FOLDER
===================================================== */

async function uploadWholeFolder(
    files
) {

    showUploadStatus(
        "Folder ကို ဖတ်နေပါသည်..."
    );


    /*
     * webkitRelativePath example:
     *
     * Project A/Documents/a.pdf
     *
     * Project A/Documents/b.pdf
     *
     * Project A/Images/photo.jpg
     */


    const firstPath =
        files[0].webkitRelativePath ||
        files[0].name;


    let rootFolderName =
        firstPath.split("/")[0];


    /*
     * If browser does not provide
     * relative paths, we can only
     * upload the selected files.
     */

    const hasPaths =
        files.some(
            file =>
                !!file.webkitRelativePath
        );


    if (!hasPaths) {

        let count = 0;


        for (
            const file of files
        ) {

            await saveUploadedFile(
                file,
                currentFolderId
            );

            count++;

            showUploadStatus(
                `${count} / ${files.length} ဖိုင်`
            );

        }


        hideUploadStatus();

        await displayCurrentFolder();

        message.textContent =
            "ဖိုင်များ တင်ပြီးပါပြီ။";

        return;

    }


    /*
     * Create root folder.
     */

    const rootFolder =
        await getOrCreateFolder(
            currentFolderId,
            rootFolderName
        );


    let processed =
        0;


    for (
        const file of files
    ) {

        const relativePath =
            file.webkitRelativePath;


        /*
         * Example:
         *
         * Project A/
         * Documents/
         * file.pdf
         */

        const parts =
            relativePath.split("/");


        /*
         * Remove root folder name.
         */

        parts.shift();


        const fileName =
            parts.pop();


        let parentId =
            rootFolder.id;


        /*
         * Create all subfolders.
         */

        for (
            const folderName of parts
        ) {

            if (!folderName) {
                continue;
            }


            const folder =
                await getOrCreateFolder(
                    parentId,
                    folderName
                );


            parentId =
                folder.id;

        }


        /*
         * Save actual file.
         */

        await saveUploadedFile(
            file,
            parentId
        );


        processed++;


        showUploadStatus(
            `${processed} / ${files.length} ဖိုင် သိမ်းနေပါသည်...`
        );

    }


    hideUploadStatus();


    await displayCurrentFolder();


    message.textContent =
        `📂 ${rootFolderName} Folder ကို ` +
        `${toMyanmarNumber(processed)} ဖိုင်နှင့်အတူ တင်ပြီးပါပြီ။`;

}

async function getOrCreateFolder(
    parentId,
    name
) {

    const children =
        await getChildren(
            parentId
        );


    const existing =
        children.find(
            item =>
                item.type === "folder" &&
                item.name === name
        );


    if (existing) {

        return existing;

    }


    const position =
        await getNextPosition(
            parentId
        );


    const folder = {

        id: makeId(),

        parentId: parentId,

        type: "folder",

        name: name,

        position: position,

        createdAt:
            Date.now()

    };


    await addItem(folder);


    return folder;

}

async function openFile(
    item
) {

    try {

        item.lastOpened = Date.now();

        await updateItem(item);

        if (!item.blob) {

            alert(
                "ဤဖိုင်၏ data မတွေ့ပါ။"
            );

            return;

        }


        const blob =
            item.blob instanceof Blob
                ? item.blob
                : new Blob(
                    [item.blob],
                    {
                        type:
                            item.mime ||
                            "application/octet-stream"
                    }
                );


        const url =
            URL.createObjectURL(
                blob
            );


        const newWindow =
            window.open(
                url,
                "_blank"
            );


        if (!newWindow) {

            const link =
                document.createElement(
                    "a"
                );


            link.href =
                url;


            link.download =
                item.name;


            link.textContent =
                "ဖိုင်ဖွင့်ရန် ဒီနေရာကိုနှိပ်ပါ";


            link.style.position =
                "fixed";

            link.style.left =
                "20px";

            link.style.right =
                "20px";

            link.style.bottom =
                "20px";

            link.style.padding =
                "16px";

            link.style.background =
                "#111827";

            link.style.color =
                "white";

            link.style.textAlign =
                "center";

            link.style.borderRadius =
                "10px";

            link.style.zIndex =
                "9999";


            document.body.appendChild(
                link
            );


            setTimeout(
                () => {

                    if (
                        link.parentNode
                    ) {

                        link.remove();

                    }

                },
                15000
            );

        }


        setTimeout(
            () => {

                URL.revokeObjectURL(
                    url
                );

            },
            60000
        );


    } catch (error) {

        console.error(error);

        alert(
            "ဖိုင်ဖွင့်၍ မရပါ။\n\n" +
            error.message
        );

    }

}

async function renameItem(
    item
) {

    if (reorderMode) {
        return;
    }


    const input =
        prompt(
            "အမည်အသစ် ထည့်ပါ:",
            item.name
        );


    if (input === null) {
        return;
    }


    const newName =
        input.trim();


    if (
        !newName ||
        newName === item.name
    ) {
        return;
    }


    if (
        newName.includes("/") ||
        newName.includes("\\")
    ) {

        alert(
            "/ နှင့် \\ မသုံးရပါ။"
        );

        return;

    }


    const children =
        await getChildren(
            currentFolderId
        );


    const duplicate =
        children.some(
            other =>
                other.id !== item.id &&
                other.name
                    .toLowerCase() ===
                newName.toLowerCase()
        );


    if (duplicate) {

        alert(
            "ဤအမည်ရှိ ဖိုင် သို့မဟုတ် ဖိုင်တွဲ ရှိပြီးသားဖြစ်သည်။"
        );

        return;

    }


    item.name =
        newName;


    await updateItem(item);


    await displayCurrentFolder();

}


/* =====================================================
   DELETE
===================================================== */

async function deleteItemAndChildren(
    item,
    ask = true
) {

    if (reorderMode) {
        return;
    }


    if (ask) {

        const confirmed =
            confirm(
                `"${item.name}" ကို ဖျက်မလား?`
            );


        if (!confirmed) {
            return;
        }

    }


    const all =
        await getAllItems();


    const ids =
        new Set([
            item.id
        ]);


    let changed =
        true;


    while (changed) {

        changed =
            false;


        for (
            const candidate of all
        ) {

            if (
                ids.has(
                    candidate.parentId
                ) &&
                !ids.has(
                    candidate.id
                )
            ) {

                ids.add(
                    candidate.id
                );

                changed =
                    true;

            }

        }

    }


    for (
        const id of ids
    ) {

        await deleteItem(id);

    }


    if (ask) {

        await displayCurrentFolder();

    }

}


/* =====================================================
   iOS-STYLE THREE-DOT COPY / CUT / PASTE MENU
===================================================== */
let actionMenuItemId = null;
let clipboardItems = [];
let clipboardMode = null; // "copy" or "cut"

async function openItemActionMenu(itemId, anchorEl){
    actionMenuItemId = itemId;
    const item = await getItem(itemId);
    if(!item){ actionMenuItemId=null; return; }
    const title = document.getElementById("touchMenuTitle");
    if(title) title.textContent = item.name;
    const copy = document.getElementById("touchCopyAction");
    const cut = document.getElementById("touchCutAction");
    const paste = document.getElementById("touchPasteAction");
    if(copy) copy.textContent = "ကူး";
    if(cut) { cut.textContent = "ဖြတ်"; cut.style.display = "block"; }
    if(paste) paste.style.display = "none";
    const sheet=document.getElementById("touchActionSheet");
    if(sheet){
        sheet.classList.add("show");
        sheet.setAttribute("aria-hidden","false");
        positionTouchMenu(anchorEl, sheet);
    }
    if(navigator.vibrate) navigator.vibrate(8);
}
function positionTouchMenu(anchorEl, sheet){
    const card = sheet ? sheet.querySelector(".touch-sheet-card") : null;
    if(!card || !anchorEl) return;

    // Wait one frame so the card has its real size before positioning.
    requestAnimationFrame(() => {
        const r = anchorEl.getBoundingClientRect();
        const w = card.offsetWidth;
        const h = card.offsetHeight;
        const gap = 8;
        const margin = 10;
        const vw = window.innerWidth;
        const vh = window.innerHeight;

        // Prefer above the ••• button, like an iOS contextual menu.
        let top = r.top - h - gap;
        if(top < margin) top = r.bottom + gap;
        if(top + h > vh - margin) top = Math.max(margin, vh - h - margin);

        // Keep the popup horizontally inside the viewport.
        let left = r.right - w;
        if(left < margin) left = margin;
        if(left + w > vw - margin) left = vw - w - margin;

        // Center the popup on the screen.
        card.style.left = "50%";
        card.style.top = "50%";
        card.style.right = "auto";
        card.style.bottom = "auto";
        card.style.margin = "0";
        card.style.transform = "translate(-50%, -50%)";
    });
}

function closeTouchMenu(){
    const sheet=document.getElementById("touchActionSheet");
    if(sheet){ sheet.classList.remove("show"); sheet.setAttribute("aria-hidden","true"); }
    actionMenuItemId=null;
}

function setClipboard(itemId, mode){
    clipboardItems=[itemId];
    clipboardMode=mode;
    updatePasteFab();
    if(navigator.vibrate) navigator.vibrate([10,30,10]);
}

function getUniqueName(name, existingNames){
    if(!existingNames.has(name.toLowerCase())) return name;
    const dot=name.lastIndexOf(".");
    const base=dot>0?name.slice(0,dot):name;
    const ext=dot>0?name.slice(dot):"";
    let n=1, candidate;
    do { candidate=`${base} (${n})${ext}`; n++; } while(existingNames.has(candidate.toLowerCase()));
    return candidate;
}

async function cloneItemTree(sourceId, destinationParentId){
    const all=await getAllItems();
    const source=all.find(x=>x.id===sourceId);
    if(!source) throw new Error("ကူးထားသော ဖိုင်/ဖိုင်တွဲ မရှိပါ။");
    const children=all.filter(x=>x.parentId===sourceId);
    const destinationChildren=all.filter(x=>x.parentId===destinationParentId);
    const names=new Set(destinationChildren.map(x=>x.name.toLowerCase()));
    const rootCopy={...source,id:makeId(),parentId:destinationParentId,name:getUniqueName(source.name,names),position:await getNextPosition(destinationParentId),createdAt:Date.now()};
    names.add(rootCopy.name.toLowerCase());
    await addItem(rootCopy);
    if(source.type==="folder") {
        for(const child of children) await cloneItemTree(child.id,rootCopy.id);
    }
    return rootCopy;
}

async function isDescendantFolder(sourceId, possibleParentId){
    if(sourceId===possibleParentId) return true;
    let cur=await getItem(possibleParentId);
    while(cur && cur.parentId){
        if(cur.parentId===sourceId) return true;
        cur=await getItem(cur.parentId);
    }
    return false;
}

async function pasteClipboardItems(){
    if(!clipboardItems.length || reorderMode) return;
    try{
        const source=await getItem(clipboardItems[0]);
        if(!source){ alert("ကူး/ဖြတ်ထားသော ဖိုင် မရှိပါ။"); return; }
        if(source.type==="folder" && await isDescendantFolder(source.id,currentFolderId)){
            alert("ဖိုင်တွဲကို ၎င်း၏အတွင်းပိုင်းထဲသို့ ကပ်၍ မရပါ။");
            return;
        }
        showUploadStatus(clipboardMode==="cut"?"ဖိုင်ကို ရွှေ့နေပါသည်...":"ဖိုင်ကို ကူးနေပါသည်...");
        if(clipboardMode==="cut") {
            const children=await getChildren(currentFolderId);
            const existing=children.find(x=>x.name.toLowerCase()===source.name.toLowerCase() && x.id!==source.id);
            if(existing) { source.name=getUniqueName(source.name,new Set(children.filter(x=>x.id!==existing.id).map(x=>x.name.toLowerCase()))); }
            source.parentId=currentFolderId;
            source.position=await getNextPosition(currentFolderId);
            await updateItem(source);
            clipboardItems=[]; clipboardMode=null;
        } else {
            await cloneItemTree(source.id,currentFolderId);
            // Copy is a one-time paste action. Clear the clipboard after a successful paste.
            clipboardItems=[];
            clipboardMode=null;
        }
        hideUploadStatus();
        closeTouchMenu();
        // Paste completed: clear the clipboard so the Paste button disappears.
        clipboardItems = [];
        clipboardMode = null;
        actionMenuItemId = null;
        updatePasteFab();
        await displayCurrentFolder();
        message.textContent="ကပ်ပြီးပါပြီ။";
    }catch(error){
        hideUploadStatus(); console.error(error); alert("ကပ်၍ မရပါ။\n\n"+error.message);
    }
}

function updatePasteFab(){
    const fab=document.getElementById("v4PasteFab");
    if(!fab) return;
    const hasClipboard = Array.isArray(clipboardItems) && clipboardItems.length > 0;
    fab.classList.toggle("show", hasClipboard);
    fab.style.display = hasClipboard ? "block" : "none";
    if(hasClipboard){
        fab.querySelector(".paste-label").textContent = clipboardMode === "cut" ? "ကပ် • ဖြတ်ထားသည်" : "ကပ် • ကူးထားသည်";
    }
}

/* =====================================================
   FILE TYPE
===================================================== */

function getFileType(
    name
) {

    const dot =
        name.lastIndexOf(".");


    if (dot === -1) {
        return "ဖိုင်";
    }


    return (
        name
            .slice(dot + 1)
            .toUpperCase() +
        " ဖိုင်"
    );

}
function formatFileSize(bytes) {

    if (!bytes || bytes <= 0) {
        return "0 B";
    }

    const units = [
        "B",
        "KB",
        "MB",
        "GB"
    ];

    let size = bytes;
    let unitIndex = 0;

    while (
        size >= 1024 &&
        unitIndex < units.length - 1
    ) {
        size = size / 1024;
        unitIndex++;
    }

    return (
        size.toFixed(
            unitIndex === 0 ? 0 : 2
        ) +
        " " +
        units[unitIndex]
    );
}

function getIcon(
    name
) {

    const parts =
        name.split(".");


    const ext =

                .toLowerCase()
            : "";


    const icons = {

        pdf: "📕",

        ppt: "📙",

        css: "🎨",

        js: "🧩",

        json: "📋",

        jpg: "🖼️",
        jpeg: "🖼️",
        png: "🖼️",
        gif: "🖼️",
        webp: "🖼️",
        svg: "🖼️",

        mp3: "🎵",
        wav: "🎵",
        flac: "🎵",

        mp4: "🎬",

    return (

}


/* =====================================================
   MYANMAR NUMBERS
===================================================== */

function toMyanmarNumber(
    value
) {

    const digits = [
        "၀",
        "၁",
        "၂",
        "၃",
        "၄",
        "၅",
        "၆",
        "၇",
        "၈",
        "၉"
    ];


    return String(
        value
    ).replace(
        /\d/g,
        digit =>
            digits[
                Number(digit)
            ]
    );

}

<script id="touch-screen-v4-js">
/* =====================================================
   TOUCH FEEDBACK
   Uses Pointer Events so Android Chrome and iOS Safari
   get the same finger-press behavior.
===================================================== */
(function initTouchScreenMode(){
  const selector = 'button,.file-item';

  function addPress(el){
    if(el && !el.disabled) el.classList.add('touch-active');
  }
  function removePress(el){
    if(el) el.classList.remove('touch-active');
  }

  document.addEventListener('pointerdown', function(e){
    const el=e.target.closest(selector);
    if(!el || el.disabled) return;
    addPress(el);
  }, {passive:true});

  ['pointerup','pointercancel','pointerleave','blur'].forEach(type=>{
    document.addEventListener(type,function(e){
      const el=e.target && e.target.closest ? e.target.closest(selector) : null;
      removePress(el);
    }, {passive:true});
  });

  /* Small Android haptic response where supported. iOS simply ignores it. */
  document.addEventListener('click',function(e){
    const el=e.target.closest('button');
    if(!el || el.disabled) return;
    if(navigator.vibrate) navigator.vibrate(8);
  }, {passive:true});

  /* Make the horizontal navigation bar easy to swipe with one finger. */
  const toolbar=document.getElementById('mainToolbar');
  if(toolbar){
    toolbar.addEventListener('wheel',function(e){
      if(window.innerWidth<=700 && Math.abs(e.deltaY)>Math.abs(e.deltaX)){
        toolbar.scrollLeft += e.deltaY;
      }
    }, {passive:true});
  }
})();
</script>

    async function showFileDetails(item) {

    if (!item) return;

    const existing =
        document.getElementById("fileDetailsModal");

    if (existing) {
        existing.remove();
    }

    const modal =
        document.createElement("div");

    modal.id = "fileDetailsModal";
    modal.className = "file-details-modal";

    const card =
        document.createElement("div");

    card.className = "file-details-card";

    const title =
        document.createElement("h3");

    title.textContent =
        "ⓘ File Details";

    card.appendChild(title);


    // Name
    const name =
        document.createElement("div");

    name.className = "file-detail-row";

    name.innerHTML =
        "<strong>Name</strong><span></span>";

    name.querySelector("span").textContent =
        item.name;

    card.appendChild(name);


    // Type
    const type =
        document.createElement("div");

    type.className = "file-detail-row";

    type.innerHTML =
        "<strong>Type</strong><span></span>";

    type.querySelector("span").textContent =
        item.type === "folder"
            ? "Folder"
            : getFileType(item.name);

    card.appendChild(type);


    // Size
    const size =
        document.createElement("div");

    size.className = "file-detail-row";

    size.innerHTML =
        "<strong>Size</strong><span></span>";

    if (
        item.type !== "folder" &&
        item.blob
    ) {
        size.querySelector("span").textContent =
            formatFileSize(item.blob.size);
    } else {
        size.querySelector("span").textContent =
            "-";
    }

    card.appendChild(size);


    // Location
    const location =
        document.createElement("div");

    location.className = "file-detail-row";

    location.innerHTML =
        "<strong>Location</strong><span></span>";

    location.querySelector("span").textContent =
        "Loading...";

    card.appendChild(location);


    // Close
    const closeBtn =
        document.createElement("button");

    closeBtn.type = "button";
    closeBtn.className = "file-details-close";
    closeBtn.textContent = "Close";

    closeBtn.addEventListener(
        "click",
        () => modal.remove()
    );

    card.appendChild(closeBtn);


    modal.appendChild(card);

    document.body.appendChild(modal);


    // Load location
    try {

        location.querySelector("span").textContent =
            await getItemPath(item);

    } catch (error) {

        console.error(
            "Could not get file location:",
            error
        );

        location.querySelector("span").textContent =
            "-";
    }
}
async function requestPersistentStorage() {

    if (!navigator.storage ||
        !navigator.storage.persist) {
        return;
    }

    try {

        const alreadyPersistent =
            await navigator.storage.persisted();

        if (alreadyPersistent) {
            console.log(
                "Persistent storage: already enabled"
            );
            return;
        }

        const granted =
            await navigator.storage.persist();

        console.log(
            "Persistent storage:",
            granted ? "enabled" : "not granted"
        );

    } catch (error) {

        console.log(
            "Persistent storage request failed:",
            error
        );

    }
}
